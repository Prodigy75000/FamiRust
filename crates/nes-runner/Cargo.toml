[package]
name = "nes-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Dev harnesses for FamiRust: CPU conformance (tomharte), headless render, and save-state fingerprinting."

# Dev harnesses. `tomharte` is the CPU conformance runner and comes first -- it
# is how we grind the Ricoh 2A03 (an NMOS 6502 sans decimal mode) to green
# against the TomHarte single-step JSON vectors, the same role it plays for the
# GBA core's ARM7 and the SNES core's 65C816. The `nes` window / png `shot` bins
# mirror the other cores and land once the PPU renders.
[[bin]]
name = "tomharte"
path = "src/tomharte.rs"

[[bin]]
name = "nes"
path = "src/nes.rs"

# Blargg test-ROM runner (the $6000 result-port protocol).
[[bin]]
name = "testrom"
path = "src/testrom.rs"

# Batch outlier classifier: sorts non-booting dumps into labelled folders.
[[bin]]
name = "classify"
path = "src/classify.rs"

# Cross-platform save-state fingerprint (netplay byte-parity proof).
[[bin]]
name = "fingerprint"
path = "src/fingerprint.rs"

# Header-correction DB generator (boot-verifies mapper fixes; emits the table).
[[bin]]
name = "gen_header_db"
path = "src/gen_header_db.rs"

[dependencies]
nes-core = { path = "../nes-core" }
png = "0.17"
# tomharte harness only: parse the SingleStepTests JSON and decompress the
# gzipped vector files we vendor under tests/vendor/. Dev-tool deps -- the core
# and the shipped libretro cdylib pull in neither.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[[bin]]
name = "pcprobe"
path = "src/pcprobe.rs"