[package]
name = "nes-libretro"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "libretro C ABI front-end for the FamiRust clean-room NES / Famicom core."

[lib]
# cdylib -> libnescore_libretro.so; renamed to the libretro convention on
# deploy (famirust_nes). Deploys to Trophy Hub as its own .so.
name = "nescore_libretro"
# `rlib` alongside the shipped `cdylib` so the FFI entry points can be driven
# from an integration test. The memory-map defect lived precisely in the gap
# between what the core believed it sent and what a front-end received, and
# that gap is only testable by calling the exported functions the way a
# front-end does. The extra artifact is not shipped.
crate-type = ["cdylib"]

[dependencies]
nes-core = { path = "../nes-core" }
